version: 1.3.12
cache: true

interface:
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  bookmarks: true
  multiConvo: true
  webSearch: true
  fileSearch: true
  runCode: true
  memories: true
  temporaryChat: true
  contextUsage: true
  mcpServers:
    use: true
    create: true
    share: false
    public: false
  skills:
    use: true
    create: true
    share: false
    public: false
  prompts:
    use: true
    create: true
    share: false
    public: false
  agents:
    use: true
    create: true
    share: true
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: true
  fileCitations: true

memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  maxInputTokens: 12000
  agent:
    enabled: true
    provider: "Claude Max"
    model: "claude-max-fast"
    instructions: >-
      Store durable user preferences and useful work context. Whenever the user
      explicitly asks to remember, change, or forget something, apply it in the
      same turn: update the matching memory instead of duplicating it, and delete
      memories the user asks you to forget. Do not store credentials, secrets, or
      transient tool output.
    model_parameters:
      reasoning_effort: "low"

# LibreChat search for tool-capable models; Bridge native search needs no Serper key.
webSearch:
  searchProvider: "serper"
  serperApiKey: "${SERPER_API_KEY}"
  scraperProvider: "serper"
  rerankerType: "jina"
  jinaApiKey: "${JINA_API_KEY}"

endpoints:
  agents:
    disableBuilder: false
    capabilities:
      - "context"
      - "file_search"
      - "web_search"
      - "tools"
      - "actions"
      - "artifacts"
      - "execute_code"
      - "skills"
      - "ocr"

  custom:
    - name: "LM Studio"
      apiKey: "${LMSTUDIO_API_KEY}"
      baseURL: "${LMSTUDIO_BASE_URL}"
      models:
        default:
          - "unsloth/gemma-4-e4b-it"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "LM Studio"

    - name: "Claude Max"
      apiKey: "${CLAUDE_BRIDGE_KEY}"
      baseURL: "http://cli-bridge:4000/v1"
      models:
        default:
          - "claude-max"
          - "claude-max-fast"
          - "claude-max-deep"
        fetch: false
      dropParams: [temperature, top_p, frequency_penalty, presence_penalty, max_tokens, max_completion_tokens, max_output_tokens, stop, seed, logit_bias, logprobs, top_logprobs, verbosity, reasoning_summary]
      titleConvo: true
      modelDisplayLabel: "Claude Max"

fileConfig:
  endpoints:
    "LM Studio":
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes:
        - "image/.*"
        - "text/.*"
        - "application/pdf"
        - "application/octet-stream"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
    "Claude Max":
      fileLimit: 10
      fileSizeLimit: 14
      totalSizeLimit: 14
      supportedMimeTypes: [".*"]

    "google":
      fileLimit: 10
      fileSizeLimit: 20
      totalSizeLimit: 50
      supportedMimeTypes:
        - "image/.*"
        - "text/.*"
        - "application/pdf"
        - "audio/.*"
        - "video/.*"

    "agents":
      fileLimit: 10
      fileSizeLimit: 25
      totalSizeLimit: 100
      supportedMimeTypes: [".*"]

  serverFileSizeLimit: 100
  avatarSizeLimit: 2

# Enable the editing workspace server below only after it exists.
# Permit its exact private host:port in mcpSettings.allowedAddresses if needed.
# mcpSettings:
#   allowedAddresses:
#     - 'host.docker.internal:8080'
mcpServers: {}
  # editing-workspace:
  #   type: streamable-http
  #   url: ${WORKSPACE_MCP_URL}
  #   headers:
  #     Authorization: "Bearer ${WORKSPACE_MCP_TOKEN}"
  #   startup: false
  #   chatMenu: true
  #   timeout: 60000

modelSpecs:
  list:
    - name: "claude-max-personalizado"
      label: "Claude"
      group: "Claude Max"
      preset:
        endpoint: "Claude Max"
        model: "claude-max"
        maxContextTokens: 1000000
        reasoning_effort: "medium"
        resendFiles: true

    - name: "claude-fast"
      label: "Claude Fast (Sonnet)"
      group: "Claude Max"
      preset:
        endpoint: "Claude Max"
        model: "claude-max-fast"
        maxContextTokens: 1000000
        reasoning_effort: "low"
        resendFiles: true

    - name: "claude-deep"
      label: "Claude Deep (Opus)"
      group: "Claude Max"
      preset:
        endpoint: "Claude Max"
        model: "claude-max-deep"
        maxContextTokens: 1000000
        reasoning_effort: "high"
        resendFiles: true

    # Requires `google` in ENDPOINTS and GOOGLE_KEY in .env. Only Gemini API
    # free-tier models; keep them in GOOGLE_MODELS so the endpoint accepts them.
    - name: "gemini-flash"
      label: "Gemini Flash"
      group: "Google"
      preset:
        endpoint: "google"
        model: "gemini-3.8-flash"
        resendFiles: true

    - name: "gemini-flash-lite"
      label: "Gemini Flash Lite"
      group: "Google"
      preset:
        endpoint: "google"
        model: "gemini-3.5-flash-lite"
        resendFiles: true

    - name: "gemini-pro"
      label: "Gemini 2.5 Pro (cuota gratuita baja)"
      group: "Google"
      preset:
        endpoint: "google"
        model: "gemini-2.5-pro"
        resendFiles: true
